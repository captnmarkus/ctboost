name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and validate against pyproject.toml
        required: true
        default: "0.1.56"
        type: string
      publish:
        description: Publish after validation (requires dispatching a v* tag)
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  release_context:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Resolve and validate release version
        id: release-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib
          import xml.etree.ElementTree as ET

          project_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]

          def required_match(path, pattern):
              text = Path(path).read_text(encoding="utf-8")
              match = re.search(pattern, text, flags=re.MULTILINE)
              if match is None:
                  raise SystemExit(f"could not resolve release version from {path}")
              return match.group(1)

          pom_root = ET.parse("bindings/jvm/pom.xml").getroot()
          pom_namespace = ""
          if pom_root.tag.startswith("{"):
              pom_namespace = pom_root.tag[1:].split("}", 1)[0]
          pom_version_node = pom_root.find(
              f"{{{pom_namespace}}}version" if pom_namespace else "version"
          )
          if pom_version_node is None or not (pom_version_node.text or "").strip():
              raise SystemExit("could not resolve release version from bindings/jvm/pom.xml")

          release_surfaces = {
              "pyproject.toml": project_version,
              "CMakeLists.txt": required_match(
                  "CMakeLists.txt",
                  r"^project\(CTBoost VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$",
              ),
              "ctboost/_version.py": required_match(
                  "ctboost/_version.py",
                  r'^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$',
              ),
              "bindings/R/ctboost/DESCRIPTION": required_match(
                  "bindings/R/ctboost/DESCRIPTION",
                  r"^Version: ([0-9]+\.[0-9]+\.[0-9]+)$",
              ),
              "bindings/jvm/pom.xml": (pom_version_node.text or "").strip(),
          }
          mismatched_surfaces = {
              path: version
              for path, version in release_surfaces.items()
              if version != project_version
          }
          if mismatched_surfaces:
              raise SystemExit(
                  "release version surfaces disagree with pyproject.toml: "
                  f"{mismatched_surfaces!r}"
              )

          event_name = os.environ["EVENT_NAME"]
          ref = os.environ["REF"]
          ref_name = os.environ["REF_NAME"]

          if event_name == "push":
              if not ref.startswith("refs/tags/v"):
                  raise SystemExit(f"release push must use a v* tag, got {ref!r}")
              requested_version = ref_name[1:]
          elif event_name == "workflow_dispatch":
              requested_version = os.environ.get("REQUESTED_VERSION", "").strip()
              if not requested_version:
                  raise SystemExit("workflow_dispatch version must not be empty")
              publish_requested = (
                  os.environ.get("REQUESTED_PUBLISH", "").strip().lower() == "true"
              )
              if publish_requested and not ref.startswith("refs/tags/v"):
                  raise SystemExit(
                      "workflow_dispatch publishing requires selecting an existing v* tag; "
                      f"got {ref!r}"
                  )
              if ref.startswith("refs/tags/v") and ref_name[1:] != requested_version:
                  raise SystemExit(
                      f"tag {ref_name!r} does not match requested version "
                      f"{requested_version!r}"
                  )
          else:
              raise SystemExit(f"unsupported release event {event_name!r}")

          if requested_version != project_version:
              raise SystemExit(
                  f"release version {requested_version!r} does not match "
                  f"pyproject.toml version {project_version!r}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={project_version}\n")
          PY

  build_wheels:
    name: Build wheels (${{ matrix.name }})
    needs: release_context
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            artifact: wheelhouse-linux-x86_64
            cibw_archs: x86_64
            cibw_build: "cp38-manylinux_x86_64 cp39-manylinux_x86_64"
            cibw_environment: ""
            cibw_config_settings: ""
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            artifact: wheelhouse-linux-aarch64
            cibw_archs: aarch64
            cibw_build: >-
              cp38-manylinux_aarch64 cp39-manylinux_aarch64
              cp310-manylinux_aarch64 cp311-manylinux_aarch64
              cp312-manylinux_aarch64 cp313-manylinux_aarch64
              cp314-manylinux_aarch64
            cibw_environment: ""
            cibw_config_settings: ""
          - name: windows-amd64
            runner: windows-latest
            artifact: wheelhouse-windows-amd64
            cibw_archs: AMD64
            cibw_build: "cp38-win_amd64 cp39-win_amd64"
            cibw_environment: ""
            cibw_config_settings: ""
          - name: macos-x86_64
            runner: macos-15-intel
            artifact: wheelhouse-macos-x86_64
            cibw_archs: x86_64
            cibw_build: >-
              cp310-macosx_x86_64 cp311-macosx_x86_64
              cp312-macosx_x86_64 cp313-macosx_x86_64
              cp314-macosx_x86_64
            cibw_environment: MACOSX_DEPLOYMENT_TARGET=10.15
            cibw_config_settings: >-
              cmake.define.CTBOOST_ENABLE_CUDA=OFF
              cmake.define.CMAKE_OSX_DEPLOYMENT_TARGET=10.15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip "cibuildwheel==3.4.1"

      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ENVIRONMENT: ${{ matrix.cibw_environment }}
          CIBW_CONFIG_SETTINGS: ${{ matrix.cibw_config_settings }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: release_context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdist
          path: dist/*.tar.gz

  build_gpu_linux_wheels:
    name: Build GPU Linux wheel (${{ matrix.python_abi }})
    needs: release_context
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_abi: cp310
            cibw_build: cp310-manylinux_x86_64
            artifact: wheelhouse-gpu-linux-cp310
          - python_abi: cp311
            cibw_build: cp311-manylinux_x86_64
            artifact: wheelhouse-gpu-linux-cp311
          - python_abi: cp312
            cibw_build: cp312-manylinux_x86_64
            artifact: wheelhouse-gpu-linux-cp312
          - python_abi: cp313
            cibw_build: cp313-manylinux_x86_64
            artifact: wheelhouse-gpu-linux-cp313
          - python_abi: cp314
            cibw_build: cp314-manylinux_x86_64
            artifact: wheelhouse-gpu-linux-cp314
    env:
      CIBW_BUILD: ${{ matrix.cibw_build }}
      CIBW_ARCHS: x86_64
      CIBW_BUILD_VERBOSITY: 3
      CIBW_TEST_REQUIRES: >-
        pytest
      CIBW_TEST_COMMAND: >-
        python {project}/tests/run_installed_smoke.py {project}/tests/test_gpu_wheel_smoke.py
      CIBW_CONFIG_SETTINGS: >-
        cmake.define.CTBOOST_ENABLE_CUDA=ON
        cmake.define.CTBOOST_REQUIRE_CUDA=ON
        cmake.define.CMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc
        cmake.define.CUDAToolkit_ROOT=/usr/local/cuda-12.8
        cmake.define.CMAKE_CUDA_ARCHITECTURES=60-real\;61-real\;70-real\;75-real\;80-real\;86-real\;89-real\;90-real\;100-real\;101-real\;120-real\;100-virtual
        wheel.license-files=LICENSE;NVIDIA-CUDA-Toolkit-LICENSE.txt
      CIBW_ENVIRONMENT: >-
        CTBOOST_EXPECT_CUDA=1
        CUDACXX=/usr/local/cuda-12.8/bin/nvcc
        CUDA_HOME=/usr/local/cuda-12.8
        CUDAToolkit_ROOT=/usr/local/cuda-12.8
        PATH=/usr/local/cuda-12.8/bin:$PATH
        LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:$LD_LIBRARY_PATH
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_BEFORE_ALL_LINUX: >-
        dnf install -y wget &&
        wget https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo -O /etc/yum.repos.d/cuda.repo &&
        dnf clean all &&
        dnf -y install cuda-compiler-12-8 cuda-cudart-devel-12-8 &&
        /usr/local/cuda-12.8/bin/nvcc --version &&
        test -f /usr/local/cuda-12.8/lib64/libcudart.so
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip "cibuildwheel==3.4.1"

      - name: Prepare authoritative CUDA runtime license
        run: python scripts/prepare_cuda_runtime_license.py

      - name: Build GPU Linux wheel
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload GPU Linux wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl

  build_gpu_windows_wheels:
    name: Build GPU Windows wheel (${{ matrix.python_abi }})
    needs: release_context
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_abi: cp310
            cibw_build: cp310-win_amd64
            artifact: wheelhouse-gpu-windows-cp310
          - python_abi: cp311
            cibw_build: cp311-win_amd64
            artifact: wheelhouse-gpu-windows-cp311
          - python_abi: cp312
            cibw_build: cp312-win_amd64
            artifact: wheelhouse-gpu-windows-cp312
          - python_abi: cp313
            cibw_build: cp313-win_amd64
            artifact: wheelhouse-gpu-windows-cp313
          - python_abi: cp314
            cibw_build: cp314-win_amd64
            artifact: wheelhouse-gpu-windows-cp314
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install CUDA toolkit
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@6008063726ffe3309d1b22e413d9e88fed91a2f2 # v0.2.29
        with:
          cuda: "12.8.1"

      - name: Normalize CUDA path
        run: |
          if (Test-Path -LiteralPath C:\cuda) {
            Remove-Item -LiteralPath C:\cuda -Recurse -Force
          }
          New-Item -ItemType Junction -Path C:\cuda -Target "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" | Out-Null
          & C:\cuda\bin\nvcc.exe --version

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip "cibuildwheel==3.4.1"

      - name: Prepare authoritative CUDA runtime license
        run: python scripts/prepare_cuda_runtime_license.py

      - name: Build GPU Windows wheel
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS: AMD64
          CIBW_BUILD_VERBOSITY: 3
          CIBW_TEST_REQUIRES: >-
            pytest
          CIBW_TEST_COMMAND: >-
            python {project}/tests/run_installed_smoke.py {project}/tests/test_gpu_wheel_smoke.py
          CIBW_BEFORE_BUILD_WINDOWS: >-
            python -m pip install --upgrade "delvewheel>=1.8"
          CIBW_TEST_ENVIRONMENT_WINDOWS: >-
            CTBOOST_EXPECT_CUDA=1
            CUDA_PATH="C:/cuda"
            CUDAToolkit_ROOT="C:/cuda"
            PATH="C:/cuda/bin;$PATH"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            python -m delvewheel repair --add-path C:/cuda/bin -w {dest_dir} {wheel}
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.CTBOOST_ENABLE_CUDA=ON
            cmake.define.CTBOOST_REQUIRE_CUDA=ON
            cmake.define.CMAKE_CUDA_COMPILER=C:/cuda/bin/nvcc.exe
            cmake.define.CUDAToolkit_ROOT=C:/cuda
            cmake.define.CMAKE_CUDA_ARCHITECTURES=60-real\;61-real\;70-real\;75-real\;80-real\;86-real\;89-real\;90-real\;100-real\;101-real\;120-real\;100-virtual
            wheel.license-files=LICENSE;NVIDIA-CUDA-Toolkit-LICENSE.txt
          CIBW_ENVIRONMENT_WINDOWS: >-
            CTBOOST_EXPECT_CUDA=1
            CUDA_PATH="C:/cuda"
            CUDAToolkit_ROOT="C:/cuda"
            CUDACXX="C:/cuda/bin/nvcc.exe"
            PATH="C:/cuda/bin;$PATH"
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload GPU Windows wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl

  validate_release_artifacts:
    name: Validate release artifacts
    needs:
      - release_context
      - build_wheels
      - build_sdist
      - build_gpu_linux_wheels
      - build_gpu_windows_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: bindings/jvm/pom.xml

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Download wheel artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: wheelhouse-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sdist
          path: dist

      - name: Validate matrix and package metadata
        env:
          RELEASE_VERSION: ${{ needs.release_context.outputs.version }}
        run: |
          python -m pip install --upgrade pip "scikit-learn>=1.3" pytest twine
          python scripts/validate_release_artifacts.py dist --version "${RELEASE_VERSION}"
          python -m twine check --strict dist/*

      - name: Validate portable runtimes from the source distribution
        env:
          RELEASE_VERSION: ${{ needs.release_context.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir sdist-source
          tar -xzf "dist/ctboost-${RELEASE_VERSION}.tar.gz" -C sdist-source
          source_root="sdist-source/ctboost-${RELEASE_VERSION}"

          for fixture in "$source_root"/tests/export_conformance/*.json; do
            cmp "$fixture" \
              "$source_root/bindings/R/ctboost/inst/extdata/export_conformance/$(basename "$fixture")"
          done

          (
            cd "$source_root/bindings/jvm"
            mvn --batch-mode --no-transfer-progress test
          )

          Rscript -e \
            'install.packages(c("jsonlite", "testthat"), repos="https://cloud.r-project.org")'
          (
            cd "$source_root"
            R CMD build bindings/R/ctboost
            package_tarball="$(realpath ctboost_${RELEASE_VERSION}.tar.gz)"
            check_directory="$(mktemp -d)"
            cd "$check_directory"
            R CMD check --no-manual --no-build-vignettes "$package_tarball"
          )

      - name: Rebuild and smoke-test the source distribution
        env:
          RELEASE_VERSION: ${{ needs.release_context.outputs.version }}
          CTBOOST_EXPECT_CUDA: "0"
          CMAKE_ARGS: -DCTBOOST_ENABLE_CUDA=OFF
        run: |
          python -m pip wheel --no-deps --wheel-dir sdist-wheel "dist/ctboost-${RELEASE_VERSION}.tar.gz"
          python -m pip install --force-reinstall sdist-wheel/*.whl
          python tests/run_installed_smoke.py tests/test_wheel_smoke.py

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish_pypi:
    name: Publish to PyPI
    needs:
      - validate_release_artifacts
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true &&
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  publish_release_assets:
    name: Publish GitHub Release Assets
    needs:
      - validate_release_artifacts
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true &&
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download validated release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-dist
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: docs/release-0.1.56.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
