name: CMake macOS synthetic launch probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  macos-synthetic-probe:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install minimal synthetic test dependencies
        run: python -m pip install psutil pytest
      - name: Diagnose synthetic controller launch
        run: python -m pytest tests/test_tabarena_local_hpo_0160.py -k synthetic_process_failure -vv --showlocals --basetemp "$RUNNER_TEMP/ctboost-macos-probe"
      - name: Inspect synthetic evidence after permit timeout
        if: always()
        run: |
          sleep 35
          python - <<'PY'
          import json, os
          from pathlib import Path
          import psutil
          root = Path(os.environ["RUNNER_TEMP"]) / "ctboost-macos-probe"
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.suffix in {".json", ".log"}:
                  print("EVIDENCE", path.relative_to(root))
                  print(path.read_text(encoding="utf-8", errors="replace"))
          remaining = []
          for process in psutil.process_iter(["pid", "create_time", "exe", "cmdline"]):
              try:
                  if any("EXPLICIT_SYNTHETIC_FIXTURE" in item for item in process.info.get("cmdline") or []):
                      remaining.append(process.info)
              except (psutil.NoSuchProcess, psutil.AccessDenied):
                  pass
          print("REMAINING_SYNTHETIC_PROCESSES", json.dumps(remaining, indent=2))
          PY
